<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الملفات القانونية</title>
<meta name="description" content="مكتبة مفتوحة للملفات القانونية: أنظمة ولوائح وعقود ونماذج وأحكام، للتصفح والتحميل مجانًا.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --text: #1c2430;
    --muted: #616b78;
    --line: #e4dfd4;
    --brand: #14324a;
    --brand-2: #1e4a6b;
    --gold: #b08a3e;
    --gold-soft: #f3ead6;
    --accent: #1e4a6b;
    --accent-ink: #ffffff;
    --accent-soft: #e6eef5;
    --hero-ink: #ffffff;
    --shadow: 0 1px 2px rgba(20,50,74,.06), 0 6px 20px rgba(20,50,74,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161c; --surface: #19212a; --text: #e9e6df; --muted: #a1abb6; --line: #2a3440;
      --brand: #0d1f2e; --brand-2: #163247; --gold: #d4b26a; --gold-soft: #2c2618;
      --accent: #8dbbe0; --accent-ink: #0d1f2e; --accent-soft: #1d2d3b; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c; --surface: #19212a; --text: #e9e6df; --muted: #a1abb6; --line: #2a3440;
    --brand: #0d1f2e; --brand-2: #163247; --gold: #d4b26a; --gold-soft: #2c2618;
    --accent: #8dbbe0; --accent-ink: #0d1f2e; --accent-soft: #1d2d3b; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif;
    font-size: 17px; line-height: 1.65;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  button { font: inherit; }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(160deg, var(--brand) 0%, var(--brand-2) 100%);
    color: var(--hero-ink); padding: 44px 0 72px; position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; inset: auto -10% -60% auto; width: 520px; height: 520px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 0 0 60px rgba(255,255,255,.025), 0 0 0 120px rgba(255,255,255,.02);
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brand svg { width: 40px; height: 40px; color: var(--gold); flex: none; }
  .brand span { font-weight: 700; font-size: 18px; opacity: .95; }
  .hero h1 {
    font-family: "Amiri", serif; font-weight: 700; font-size: clamp(30px, 6vw, 46px);
    line-height: 1.3; margin: 0 0 10px;
  }
  .hero p { margin: 0; max-width: 620px; opacity: .85; }
  .stats { display: flex; gap: 22px; margin-top: 18px; font-size: 15px; opacity: .9; flex-wrap: wrap; }
  .stats b { color: var(--gold); font-size: 20px; margin-inline-end: 4px; }

  /* ---------- Search ---------- */
  .searchbar { position: relative; margin-top: -30px; z-index: 2; }
  .searchbar .box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 6px 16px; box-shadow: var(--shadow);
  }
  .searchbar svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
  .searchbar input {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent;
    border: 0; outline: none; padding: 12px 0;
  }
  .searchbar .box:focus-within { border-color: var(--accent); }

  /* ---------- Sections ---------- */
  h2.title { font-size: 20px; margin: 34px 0 14px; display: flex; align-items: center; gap: 10px; }
  h2.title::before { content: ""; width: 4px; height: 20px; border-radius: 2px; background: var(--gold); }
  .sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .sec {
    text-align: start; cursor: pointer; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s, transform .15s;
  }
  .sec:hover { border-color: var(--accent); transform: translateY(-1px); }
  .sec[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .sec .ic {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: var(--gold-soft); color: var(--gold);
  }
  .sec .ic svg { width: 22px; height: 22px; }
  .sec .nm { font-weight: 700; line-height: 1.4; }
  .sec .ct { color: var(--muted); font-size: 14px; }

  /* ---------- Files ---------- */
  .listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .listhead .count { color: var(--muted); font-size: 14px; }
  .clear { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 15px; }
  ul.list { list-style: none; margin: 0 0 48px; padding: 0; display: grid; gap: 10px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .doc {
    flex: none; width: 42px; height: 52px; border-radius: 6px; position: relative;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: end center; padding-bottom: 7px;
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
  }
  .doc::before {
    content: ""; position: absolute; top: 0; left: 0; width: 12px; height: 12px;
    background: linear-gradient(225deg, transparent 50%, var(--line) 50%); border-bottom-right-radius: 3px;
  }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 500; overflow-wrap: anywhere; line-height: 1.5; }
  .info { color: var(--muted); font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { background: var(--gold-soft); color: var(--gold); border-radius: 999px; padding: 0 10px; font-size: 13px; }
  .actions { display: flex; gap: 8px; flex: none; }
  .btn {
    font-size: 15px; cursor: pointer; text-decoration: none;
    border-radius: 10px; padding: 8px 16px; border: 1px solid var(--accent);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--accent); }
  .empty {
    text-align: center; color: var(--muted); padding: 40px 16px;
    border: 1px dashed var(--line); border-radius: 14px;
  }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; text-align: center; padding: 22px 16px 36px; }
  @media (max-width: 600px) {
    .hero { padding: 32px 0 64px; }
    .sections { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .sec { padding: 14px; }
    .item { flex-wrap: wrap; }
    .actions { width: 100%; }
    .actions .btn { flex: 1; }
  }

  /* ---------- Viewer ---------- */
  .viewer { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column; }
  .viewer.open { display: flex; }
  .vbar {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    background: var(--brand); color: var(--hero-ink);
  }
  .vbar .btn.ghost { color: var(--hero-ink); border-color: rgba(255,255,255,.4); }
  .vbar .btn.primary { background: var(--gold); border-color: var(--gold); color: #1c1608; }
  .vtitle { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vbody { flex: 1; overflow: auto; padding: 16px 8px; }
  .vbody canvas { display: block; margin: 0 auto 12px; max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
  .vstatus { text-align: center; color: var(--muted); padding: 30px 0; }
  .zoom { display: flex; gap: 4px; }
  .zoom .btn { padding: 6px 12px; }
  @media (max-width: 600px) { .zoom { display: none; } .vbar .btn { padding: 6px 12px; } }
</style>
</head>
<body>
  <section class="hero">
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zm14 0l-3 7a3 3 0 0 0 6 0l-3-7zM12 3l-1 1h2z"/></svg>
        <span>المكتبة القانونية</span>
      </div>
      <h1>الملفات القانونية</h1>
      <p>أنظمة ولوائح وعقود ونماذج وأحكام، متاحة للجميع. تصفح أي ملف مباشرة من المتصفح أو حمّله على جهازك بدون تسجيل دخول.</p>
      <div class="stats"><div><b id="stFiles">0</b> ملف</div><div><b id="stSecs">0</b> قسم</div></div>
    </div>
  </section>

  <main class="wrap">
    <div class="searchbar">
      <label class="box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="ابحث في جميع الملفات…" autocomplete="off" aria-label="بحث">
      </label>
    </div>

    <h2 class="title">الأقسام</h2>
    <div class="sections" id="sections"></div>

    <div class="listhead">
      <h2 class="title" id="listTitle">جميع الملفات</h2>
      <div class="count"><span id="count"></span> <button class="clear" id="clear" type="button" hidden>عرض الكل</button></div>
    </div>
    <ul class="list" id="list"><li class="empty">جارٍ تحميل الملفات…</li></ul>
  </main>

  <footer>المكتبة القانونية · جميع الملفات متاحة مجانًا للتصفح والتحميل</footer>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vtitle">
    <div class="vbar">
      <button class="btn ghost" id="close" type="button">رجوع</button>
      <div class="vtitle" id="vtitle"></div>
      <div class="zoom">
        <button class="btn ghost" id="zout" type="button" aria-label="تصغير">−</button>
        <button class="btn ghost" id="zin" type="button" aria-label="تكبير">+</button>
      </div>
      <a class="btn primary" id="vdl" download>تحميل</a>
    </div>
    <div class="vbody" id="vbody"></div>
  </div>

<script src="lib/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";

  // كل قسم = مجلد داخل مجلد files. ترتيب الأقسام ووصفها في sections.json
  const REPO = "razanabdulaziz92-source/legal-files";
  const OTHER = "ملفات عامة";

  const ICONS = [
    '<path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zm14 0l-3 7a3 3 0 0 0 6 0l-3-7z"/>',
    '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
    '<path d="M14.5 3.5l6 6M12 6l6 6M4 20l8-8M9.5 8.5l6 6M13 3l8 8-3 3-8-8z"/>',
    '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
    '<circle cx="12" cy="9" r="5"/><path d="M8.5 13 7 21l5-3 5 3-1.5-8"/>',
    '<path d="M3 7h18M3 12h18M3 17h12"/>'
  ];
  const icon = i => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[i % ICONS.length]}</svg>`;
  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';

  const $ = id => document.getElementById(id);
  const listEl = $("list"), secEl = $("sections"), qEl = $("q");
  let files = [], sections = [], current = "";

  const norm = s => s.toLowerCase()
    .replace(/[ً-ٰٟـ]/g, "")
    .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
  const toTitle = n => n.replace(/\.pdf$/i, "").replace(/[_-]+/g, " ").trim();
  const enc = p => p.split("/").map(encodeURIComponent).join("/");
  function fmtSize(b) {
    if (!b) return "";
    if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + " ك.ب";
    return (b / 1024 / 1024).toFixed(1) + " م.ب";
  }

  function renderSections() {
    secEl.innerHTML = "";
    sections.forEach((s, i) => {
      const n = files.filter(f => f.section === s.name).length;
      const b = document.createElement("button");
      b.type = "button"; b.className = "sec";
      b.setAttribute("aria-pressed", String(current === s.name));
      b.innerHTML = `<div class="ic">${icon(s.icon ?? i)}</div><div class="nm"></div><div class="ct"></div>`;
      b.querySelector(".nm").textContent = s.name;
      b.querySelector(".ct").textContent = n ? `${n} ملف` : "قريبًا";
      if (s.desc) b.title = s.desc;
      b.onclick = () => setSection(current === s.name ? "" : s.name);
      secEl.appendChild(b);
    });
    $("stFiles").textContent = files.length;
    $("stSecs").textContent = sections.length;
  }

  function renderList() {
    const q = norm(qEl.value.trim());
    const shown = files.filter(f =>
      (!current || f.section === current) &&
      (!q || norm(f.title).includes(q) || norm(f.section).includes(q)));
    $("listTitle").textContent = current || (q ? "نتائج البحث" : "جميع الملفات");
    $("clear").hidden = !current && !q;
    $("count").textContent = files.length ? `${shown.length} ملف` : "";
    listEl.innerHTML = "";
    if (!shown.length) {
      const msg = !files.length ? "لا توجد ملفات بعد." : q ? "لا توجد نتائج مطابقة لبحثك." : "لا توجد ملفات في هذا القسم بعد.";
      listEl.innerHTML = `<li class="empty">${msg}</li>`;
      return;
    }
    for (const f of shown) {
      const li = document.createElement("li");
      li.className = "item";
      li.innerHTML = `
        <div class="doc">PDF</div>
        <div class="meta"><div class="name"></div><div class="info"></div></div>
        <div class="actions">
          <button class="btn primary" type="button">${EYE}عرض</button>
          <a class="btn ghost">${DL}تحميل</a>
        </div>`;
      li.querySelector(".name").textContent = f.title;
      const info = li.querySelector(".info");
      if (!current) { const t = document.createElement("span"); t.className = "tag"; t.textContent = f.section; info.appendChild(t); }
      const sz = document.createElement("span"); sz.textContent = fmtSize(f.size); info.appendChild(sz);
      li.querySelector("button").onclick = () => openViewer(f);
      const a = li.querySelector("a");
      a.href = f.url; a.setAttribute("download", f.file);
      listEl.appendChild(li);
    }
  }

  function setSection(name, push = true) {
    current = name;
    renderSections(); renderList();
    if (push) history.pushState(null, "", name ? "#s=" + encodeURIComponent(name) : location.pathname);
    if (name) document.querySelector(".listhead").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("clear").onclick = () => { qEl.value = ""; setSection(""); };
  qEl.addEventListener("input", renderList);

  // ---------- Viewer ----------
  const viewer = $("viewer"), vbody = $("vbody");
  let doc = null, scale = 1, token = 0;

  async function renderPages() {
    const t = ++token;
    vbody.innerHTML = "";
    const width = Math.min(vbody.clientWidth - 16, 900);
    const dpr = window.devicePixelRatio || 1;
    for (let i = 1; i <= doc.numPages; i++) {
      if (t !== token) return;
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (width / base.width) * scale * dpr });
      const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + "px";
      vbody.appendChild(c);
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
  }
  async function openViewer(f, push = true) {
    $("vtitle").textContent = f.title;
    const dl = $("vdl"); dl.href = f.url; dl.setAttribute("download", f.file);
    viewer.classList.add("open"); document.body.style.overflow = "hidden";
    if (push) history.pushState(null, "", "#f=" + encodeURIComponent(f.path));
    vbody.innerHTML = '<div class="vstatus">جارٍ فتح الملف…</div>';
    scale = 1;
    try {
      doc = await pdfjsLib.getDocument({ url: f.url, isEvalSupported: false }).promise;
      await renderPages();
    } catch (e) {
      vbody.innerHTML = '<div class="vstatus">تعذّر عرض الملف هنا. يمكنك تحميله بزر «تحميل».</div>';
    }
  }
  function closeViewer() {
    token++; viewer.classList.remove("open"); document.body.style.overflow = "";
    vbody.innerHTML = ""; doc = null;
  }
  $("close").onclick = () => location.hash.startsWith("#f=") && history.length > 1 ? history.back() : closeViewer();
  $("zin").onclick = () => { if (doc) { scale = Math.min(scale + .25, 3); renderPages(); } };
  $("zout").onclick = () => { if (doc) { scale = Math.max(scale - .25, .5); renderPages(); } };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && viewer.classList.contains("open")) $("close").click(); });

  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith("f=")) {
      const f = files.find(x => x.path === h.slice(2));
      if (f) return openViewer(f, false);
    }
    if (viewer.classList.contains("open")) closeViewer();
    const s = h.startsWith("s=") ? h.slice(2) : "";
    if (s !== current) setSection(sections.some(x => x.name === s) ? s : "", false);
  }
  window.addEventListener("popstate", fromHash);

  // ---------- Data ----------
  async function loadPaths() {
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`, { cache: "no-cache" });
      if (!r.ok) throw 0;
      const d = await r.json();
      return d.tree.filter(x => x.type === "blob" && x.path.startsWith("files/")).map(x => ({ path: x.path.slice(6), size: x.size }));
    } catch (e) {
      const r = await fetch("files.json", { cache: "no-cache" });
      return r.json();
    }
  }
  async function loadSections() {
    try { const r = await fetch("sections.json", { cache: "no-cache" }); return r.ok ? r.json() : []; }
    catch (e) { return []; }
  }

  Promise.all([loadPaths(), loadSections()]).then(([paths, secs]) => {
    files = paths.filter(p => /\.pdf$/i.test(p.path)).map(p => {
      const parts = p.path.split("/");
      const file = parts.pop();
      return {
        path: p.path, file, size: p.size,
        section: parts[0] || OTHER,
        title: toTitle(file),
        url: "files/" + enc(p.path)
      };
    }).sort((a, b) => a.title.localeCompare(b.title, "ar"));
    // الأقسام المعرّفة أولًا، ثم أي مجلد جديد يُضاف لاحقًا
    sections = secs.map(s => ({ ...s }));
    const folders = [...new Set(paths.map(p => p.path.split("/")).filter(a => a.length > 1).map(a => a[0]))];
    for (const name of [...folders, ...(files.some(f => f.section === OTHER) ? [OTHER] : [])])
      if (!sections.some(s => s.name === name)) sections.push({ name });
    renderSections(); renderList(); fromHash();
  }).catch(() => { listEl.innerHTML = '<li class="empty">تعذّر تحميل قائمة الملفات. حاول تحديث الصفحة.</li>'; });
</script>
</body>
</html>
